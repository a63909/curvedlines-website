# Include in the HTTPS server for mayday.colorchain.ru.
location = /admin/downloads {
    return 308 /admin/downloads/;
}

location ^~ /admin/downloads/ {
    auth_basic "Mayday statistics";
    auth_basic_user_file /etc/nginx/mayday-download-dashboard.htpasswd;
    satisfy all;
    limit_except GET { deny all; }

    alias /var/lib/mayday-download-dashboard/;
    index dashboard.html;
    autoindex off;
    default_type text/html;
    charset utf-8;
    etag off;
    if_modified_since off;
    add_header Strict-Transport-Security "max-age=63072000" always;
    add_header Cache-Control "private, no-store" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; base-uri 'none'; frame-ancestors 'none'" always;
}
