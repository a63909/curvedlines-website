# Loaded in the http context. Keep the statistics private and independent of client identifiers.
map $uri $mayday_install_file {
    default 0;
    "~^/releases/(?:mayday-[0-9]+\.apk|Mayday-Windows-x64-[0-9]+(?:\.[0-9]+)+\.(?:zip|msi)|MaydaySetup-x64-[0-9]+(?:\.[0-9]+)+\.exe|mayday-macos-(?:(?:universal|arm64|x64)-)?[0-9]+(?:\.[0-9]+)+\.dmg)$" 1;
}

map $arg_download $mayday_download_id {
    default "-";
    "~^[0-9a-f]{32}$" $arg_download;
}

map "$request_method:$mayday_install_file:$mayday_download_id:$http_sec_fetch_mode" $mayday_start_download {
    default 0;
    "GET:1:-:navigate" 1;
}

map "$request_method:$status:$mayday_install_file" $mayday_record_download {
    default 0;
    "GET:200:1" 1;
    "GET:206:1" 1;
}

log_format mayday_download escape=json
    '{"time":"$time_iso8601","uri":"$uri","sent":"$body_bytes_sent",'
    '"length":"$sent_http_content_length","status":"$status",'
    '"range":"$sent_http_content_range","download":"$mayday_download_id"}';
